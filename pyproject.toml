[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lec-reconciliation-agent"
version = "0.1.0"
description = "Auditable reconciliation of simulation decisions against delayed warehouse truth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.scripts]
lec-reconcile = "reconciliation_agent.cli:main"

[project.optional-dependencies]
app = [
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.61,<2",
    "uvicorn>=0.34,<1",
]
dev = [
    "hypothesis>=6,<7",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
